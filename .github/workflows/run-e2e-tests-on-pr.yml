name: Run E2E Tests on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  run-e2e-tests-using-docker-compose:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Run E2E tests using Docker Compose
      run: |
        docker compose -f ./e2e/docker-compose.yml up --build to-dos-api-dotnet-e2e-tests
