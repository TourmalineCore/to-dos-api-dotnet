name: Run E2E Tests on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  run-e2e-tests-using-docker-compose:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    # - name: Run API using Docker Compose
    #   run: |
    #     docker compose up --build to-dos-api-dotnet-api \
    #         > /dev/null 2>&1 &

    - name: Run E2E tests using Docker Compose
      run: |
        docker compose -f ./docker-compose.yml -f ./e2e/docker-compose.yml up --build --exit-code-from to-dos-api-dotnet-e2e-tests
      env:
        "API_ROOT_URL": "http://localhost:6401"
