services:

  to-dos-api-dotnet-api:
    container_name: to-dos-api-dotnet-api
    depends_on:
      to-dos-api-dotnet-db:
        condition: service_healthy
    build:
      dockerfile: ./Api/Dockerfile
      context: .
    ports:
      - 6401:80
    networks:
      - to-dos-api-dotnet-network

  # https://event-driven.io/en/automatically_connect_pgadmin_to_database/
  to-dos-api-dotnet-pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: to-dos-api-dotnet-pgadmin
    depends_on:
      to-dos-api-dotnet-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: to-dos-api-dotnet-db
      PGADMIN_DEFAULT_EMAIL: admin@admin.org
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      # these 2 variables PGADMIN_CONFIG_PROXY_X_HOST_COUNT and PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT
      # are needed to enable PgAdmin in Codespaces scenario when it is behind a reverse proxy
      # https://github.com/orgs/community/discussions/17918
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: 1
    ports:
      - 9401:80
    networks:
      - to-dos-api-dotnet-network
    volumes:
      # this is needed so that we can spin it up from within Dev Container where LOCAL_WORKSPACE_FOLDER is defined and from a simple OS terminal of the repo root
      # list of available config properties can be found here in the source code https://github.com/pgadmin-org/pgadmin4/blob/00dbe58125f0304186f1af5374c9c43bc22d0410/web/pgadmin/utils/__init__.py#L505
      # Password is no longer a part of this list as it seems to be when the linked article was written
      - ${LOCAL_WORKSPACE_FOLDER:-.}/pgAdmin.json:/pgadmin4/servers.json

  to-dos-api-dotnet-db:
    image: postgres:18.6
    container_name: to-dos-api-dotnet-db
    environment:
      POSTGRES_DB: to-dos-api-dotnet-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 7401:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - to-dos-api-dotnet-network

  to-dos-api-dotnet-e2e-tests:
    # if you specify container_name it provides a pretty name of the container in Docker Desktop
    # visually it shows e2e-tests sub-container name inside of to-dos-api-dotnet parent container
    container_name: 'to-dos-api-dotnet-e2e-tests'
    build:
      context: ./e2e
      dockerfile: ./Dockerfile
    # service_started is not what we need, we need deps to be healthy and ready, this needs to be implemented properly 
    depends_on:
      to-dos-api-dotnet-api:
        condition: service_started
    # restart twice in case of not ready deps or network failures
    restart: on-failure:2
    # we pass the tests folder path as an argument to the docker container's entrypoint
    command: run ./e2e-copy
    volumes:
      # this is needed so that we can spin it up from within Dev Container where LOCAL_WORKSPACE_FOLDER is defined and leads to the absolute OS local path of the folder
      # wihtout this, if we simply use ./e2e from within Dev Container we have this path /workspaces/to-dos-api-dotnet/e2e which doesn't exist in the Host OS
      # from a simple OS terminal of the repo root where LOCAL_WORKSPACE_FOLDER is not defined . leads to the expected existing absolute OS local path of the folder
      # interpolation syntax explanation lives here https://docs.docker.com/reference/compose-file/interpolation/
      # we need only e2e folder to run its Karate tests
      - ${LOCAL_WORKSPACE_FOLDER:-.}/e2e:/e2e-copy
    environment:
      API_ROOT_URL: "http://to-dos-api-dotnet-api"
    networks:
      - to-dos-api-dotnet-network

networks:
  to-dos-api-dotnet-network:
